# Current Alacritty format; alacritty.yml is retained for older installations.
[window]
decorations = "Buttonless"

[window.dimensions]
columns = 80
lines = 25

[window.padding]
x = 16
y = 16

[scrolling]
history = 10000
multiplier = 3

[font]
size = 18.0

[font.normal]
family = "PragmataPro Liga"
style = "Regular"

[font.bold]
family = "PragmataPro Liga"
style = "Bold"

[font.italic]
family = "PragmataPro Liga"
style = "Italic"

[colors.primary]
background = "#000000"
foreground = "#ffffff"

[colors.cursor]
cursor = "#cd5c5c"
text = "#000000"

[colors.normal]
black = "#000000"
red = "#b03060"
green = "#66cdaa"
yellow = "#ffe4b5"
blue = "#483d8b"
magenta = "#663399"
cyan = "#add8e6"
white = "#bebebe"

[colors.bright]
black = "#404040"
red = "#b03060"
green = "#7fffd4"
yellow = "#ffe4b5"
blue = "#483d8b"
magenta = "#663399"
cyan = "#add8e6"
white = "#ffffff"

[mouse]
hide_when_typing = false

[cursor]
style = "Block"
unfocused_hollow = true

[[keyboard.bindings]]
key = "W"
mods = "Command"
action = "Quit"

[[keyboard.bindings]]
key = "K"
mods = "Command"
action = "ClearHistory"
